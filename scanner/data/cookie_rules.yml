# Built-in cookie classification knowledge base.
#
# cookies:  matched against the cookie name. `name` supports the wildcard `*`.
#           Optional `domains` restricts a rule to cookies set on those domains
#           (or their subdomains), for names that are too generic on their own.
# domains:  fallback evidence based on the domain a cookie is set on.
# keywords: fallback evidence based on regular expressions over the cookie name.
#
# Fallback evidence (domains + keywords) for the same category is combined, so
# two weak signals can together exceed the confidence threshold.

